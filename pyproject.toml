[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "player-mk1"
version = "0.1.0"
description = "Screen-perception game player: sensors to WorldState, WorldState to scheduled input"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "mss>=9.0",
    "PyYAML>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
detector = ["onnxruntime>=1.17"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
player = "player.cli:main"

[tool.setuptools.packages.find]
include = ["player*", "games*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
