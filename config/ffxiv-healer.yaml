# player_mk1 — FFXIV healer configuration
#
# Read docs/SAFETY.md before setting dry_run to false. A healer in a party affects seven
# other people; see the last section of docs/ENCOUNTERS.md.

game: ffxiv

runtime:
  dry_run: true
  capture_fps: 60
  status_interval_s: 5.0
  max_runtime_s: null

capture:
  downscale: 1.0

ffxiv:
  layout_path: config/ffxiv.layout.json
  job: whm
  rotation: whm.healer
  gcd_recast_s: 2.5
  detector_model: null

  # `keys` carries overrides only — the job's defaults are merged underneath, so this
  # need only list binds that differ from FFXIV's own first hotbar.
  keys: {}

  # Party-list slot keys, used as the *fallback* when mouseover is unavailable.
  #
  # Heals prefer mouseover, because a slot key changes your hard target and the next
  # Glare would then land on the ally you just healed. Mouseover leaves the boss
  # selected, which is why FFXIV healers use it.
  party_slot_keys: ["f1", "f2", "f3", "f4", "f5", "f6", "f7", "f8"]

  # Enemy-list slot keys. Needed for scripted add phases, where "kill this in eight
  # seconds" cannot rely on tab-cycle ordering landing on the right mob.
  enemy_slot_keys: []

  # Learned cast-name signatures. Cast-bar reading is closed-set classification against
  # the casts an encounter declares, not OCR — see games/ffxiv/castbar.py. Without this
  # the reader honestly reports nothing and CastTrigger falls back to timeline triggers.
  cast_library_path: null

safety:
  kill_key: f12
  pause_key: f11
  # Higher than the caster default: a healer legitimately presses more, because target
  # acquisition and the ability are separate events.
  max_actions_per_sec: 30
  max_state_age_ms: 250
  min_confidence: 0.5
  require_foreground: true
  takeover_cooldown_ms: 1500

record:
  enabled: true
  root: sessions
  frame_every_n: 2
  jpeg_quality: 80

director:
  enabled: false
  model: claude-opus-5
  effort: low
  min_interval_s: 5.0
  screenshot_every_n_calls: 3
  max_output_tokens_per_session: 60000
